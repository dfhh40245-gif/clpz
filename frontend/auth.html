<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in or sign up — CLPZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --panel:#141416; --panel-raised:#1c1c1f;
    --border:#222226; --border-strong:#3a3a40;
    --ink:#ededed; --ink-dim:#a0a0a8; --ink-faint:#6b6b73;
    --accent:#f0a030; --accent-ink:#0a0a0b; --accent-soft:rgba(240,160,48,.13);
    --danger:#f87171;
    --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;    background:var(--bg);
    color:var(--ink); font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .topbar{ padding:var(--s6); }
  .back{ font-size:14px; color:var(--ink-dim); display:inline-flex; align-items:center; gap:6px; }
  .back:hover{ color:var(--ink); }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:var(--s6); }
  .panel{ width:100%; max-width:400px; animation:panelIn .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes panelIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  .logo{ font-family:var(--font-display); font-weight:700; font-size:22px; text-align:center; margin-bottom:var(--s8); display:block; }

  .tabs{ display:flex; border-bottom:1px solid var(--border); margin-bottom:var(--s6); }
  .tab{
    flex:1; text-align:center; padding-bottom:var(--s3); font-size:14.5px; font-weight:600;
    color:var(--ink-faint); border-bottom:2px solid transparent; margin-bottom:-1px;
    background:none; border-top:0; border-left:0; border-right:0; cursor:pointer;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }

  h1{ font-family:var(--font-display); font-size:22px; margin:0 0 var(--s6); text-align:center; font-weight:600; }

  form{ display:flex; flex-direction:column; gap:var(--s4); }
  .field label{ display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px; }
  .field input{
    width:100%; height:44px; background:var(--panel); border:1px solid var(--border-strong);
    border-radius:var(--r-md); padding-inline:var(--s4); color:var(--ink); font-size:14.5px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus{ border-color:var(--accent); outline:none; box-shadow:0 0 0 3px rgba(239,169,58,.12); }
  .row-between{ display:flex; justify-content:space-between; align-items:center; }
  .forgot{ font-size:12.5px; color:var(--ink-faint); }
  .forgot:hover{ color:var(--ink-dim); }

  .btn{
    height:46px; border-radius:var(--r-md); font-size:14.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; border:0;
    transition:background-color .12s ease, opacity .12s ease;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); border-radius:9999px; }
  .btn-primary:hover{ background:#f5b34d; }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-primary:disabled{ opacity:.6; cursor:default; transform:none; box-shadow:none; }
  .btn-google{
    background:var(--panel); border:1px solid var(--border-strong); color:var(--ink);
    transition:border-color .2s ease, background .2s ease;
  }
  .btn-google:hover{ border-color:var(--ink-dim); background:var(--panel-raised); }

  .divider{ display:flex; align-items:center; gap:var(--s3); margin:var(--s2) 0; color:var(--ink-faint); font-size:12.5px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--border); }

  .error{
    display:none; font-size:13px; color:var(--danger); background:rgba(248,113,113,.1);
    border:1px solid rgba(248,113,113,.3); border-radius:var(--r-sm); padding:var(--s3);
  }
  .error.show{ display:block; }

  .success{
    display:none; font-size:13px; color:#34d399; background:rgba(52,211,153,.1);
    border:1px solid rgba(52,211,153,.3); border-radius:var(--r-sm); padding:var(--s3);
  }
  .success.show{ display:block; }

  .reassure{ margin-top:var(--s6); font-size:12.5px; color:var(--ink-faint); text-align:center; line-height:1.6; }

  form.hidden{ display:none; }

  .loading{ display:none; text-align:center; padding:var(--s10) 0; color:var(--ink-dim); }
  .loading.show{ display:block; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M11 5l-7 7 7 7M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    CLPZ
  </a>
</div>

<main>
  <!-- Loading spinner shown while checking existing session -->
  <div class="loading" id="loadingState">
    <p>Checking session…</p>
  </div>

  <div class="panel" id="authPanel" style="display:none;">
    <span class="logo">CLPZ</span>

    <div class="tabs" role="tablist">
      <button class="tab" id="tabLogin" role="tab">Log in</button>
      <button class="tab" id="tabSignup" role="tab">Sign up</button>
    </div>

    <h1 id="formHeading">Create your account</h1>
    <div class="error" id="errorBox" role="alert"></div>
    <div class="success" id="successBox"></div>

    <form id="loginForm" class="hidden" autocomplete="on">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <div class="row-between">
          <label for="loginPassword" style="margin-bottom:0;">Password</label>
          <a href="#" class="forgot" id="forgotLink">Forgot password?</a>
        </div>
        <input type="password" id="loginPassword" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="loginSubmit">Log in</button>
      <div class="divider">or</div>
      <button type="button" class="btn btn-google" id="googleLoginBtn">
        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </form>

    <form id="signupForm" autocomplete="on">
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" name="password" required autocomplete="new-password" minlength="6" />
      </div>
      <div class="field">
        <label for="signupConfirm">Confirm password</label>
        <input type="password" id="signupConfirm" name="confirm" required autocomplete="new-password" minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary" id="signupSubmit">Create account</button>
      <div class="divider">or</div>
      <button type="button" class="btn btn-google" id="googleSignupBtn">
        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </form>

    <p class="reassure">Your email is only used to save your projects and manage your free clips. No spam, and we won't sell your data.</p>
  </div>
</main>

<script>
(function() {
  var APP_ROUTE = 'clpz.html';
  var tabLogin = document.getElementById('tabLogin');
  var tabSignup = document.getElementById('tabSignup');
  var loginForm = document.getElementById('loginForm');
  var signupForm = document.getElementById('signupForm');
  var heading = document.getElementById('formHeading');
  var errorBox = document.getElementById('errorBox');
  var successBox = document.getElementById('successBox');
  var loadingState = document.getElementById('loadingState');
  var authPanel = document.getElementById('authPanel');

  function setMode(mode) {
    var isLogin = mode === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabSignup.classList.toggle('active', !isLogin);
    loginForm.classList.toggle('hidden', !isLogin);
    signupForm.classList.toggle('hidden', isLogin);
    heading.textContent = isLogin ? 'Log in to CLPZ' : 'Create your account';
    hideMessages();
    history.replaceState(null, '', 'auth.html?mode=' + mode);
  }
  tabLogin.addEventListener('click', function() { setMode('login'); });
  tabSignup.addEventListener('click', function() { setMode('signup'); });
  var params = new URLSearchParams(location.search);
  setMode(params.get('mode') === 'login' ? 'login' : 'signup');

  function showError(msg) { successBox.classList.remove('show'); errorBox.textContent = msg; errorBox.classList.add('show'); }
  function showSuccess(msg) { errorBox.classList.remove('show'); successBox.textContent = msg; successBox.classList.add('show'); }
  function hideMessages() { errorBox.classList.remove('show'); successBox.classList.remove('show'); }

  async function api(path, opts) {
    opts = opts || {};
    var r = await fetch(path, opts);
    var ct = r.headers.get('content-type') || '';
    var d = ct.includes('application/json') ? await r.json() : null;
    if (!r.ok) throw new Error((d && (d.detail || d.message)) || 'Request failed (' + r.status + ')');
    return d;
  }

  async function checkSession() {
    try { var result = await api('/api/auth/me'); if (result && result.user) { window.location.href = APP_ROUTE; return; } } catch (e) {}
    loadingState.classList.remove('show'); authPanel.style.display = '';
  }

  loginForm.addEventListener('submit', async function(e) {
    e.preventDefault(); hideMessages();
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var btn = document.getElementById('loginSubmit');
    btn.disabled = true; btn.textContent = 'Logging in...';
    try {
      var result = await api('/api/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email, password: password}) });
      if (!result.email_verified) {
        showSuccess('Please verify your email.');
        try { await api('/api/auth/request-verification', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email}) }); } catch (ve) {} showSuccess('A verification code has been sent to ' + email + '. Check your inbox.');
        heading.textContent = 'Verify your email'; loginForm.classList.add('hidden'); signupForm.classList.add('hidden');
        heading.insertAdjacentHTML('afterend', '<div id="verifyBox"><form id="verifyForm"><div class="field"><label>Code</label><input type="text" id="verifyCode" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:8px"></div><button type="submit" class="btn btn-primary">Verify</button></form></div>');
        document.getElementById('verifyForm').addEventListener('submit', async function(ve) { ve.preventDefault(); try { await api('/api/auth/verify-email', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email, code: document.getElementById('verifyCode').value.trim()}) }); showSuccess('Verified! Redirecting...'); setTimeout(function() { window.location.href = APP_ROUTE; }, 1000); } catch (err) { showError(err.message); } });
        return;
      }
      window.location.href = APP_ROUTE;
    } catch (err) { showError(err.message); } finally { btn.disabled = false; btn.textContent = 'Log in'; }
  });

  signupForm.addEventListener('submit', async function(e) {
    e.preventDefault(); hideMessages();
    var email = document.getElementById('signupEmail').value.trim();
    var password = document.getElementById('signupPassword').value;
    var confirm = document.getElementById('signupConfirm').value;
    var btn = document.getElementById('signupSubmit');
    if (password !== confirm) { showError('Passwords do not match.'); return; }
    if (password.length < 6) { showError('Password needs at least 6 characters.'); return; }
    btn.disabled = true; btn.textContent = 'Creating account...';
    try {
      await api('/api/auth/signup', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email, password: password, display_name: ''}) });
      showSuccess('Account created! Please verify your email.');
      try { await api('/api/auth/request-verification', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email}) }); } catch (ve) {} showSuccess('A verification code has been sent to ' + email + '. Check your inbox.');
      heading.textContent = 'Verify your email'; signupForm.classList.add('hidden');
      heading.insertAdjacentHTML('afterend', '<div id="verifyBox"><form id="verifyForm"><div class="field"><label>Code</label><input type="text" id="verifyCode" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:8px"></div><button type="submit" class="btn btn-primary">Verify</button></form></div>');
      document.getElementById('verifyForm').addEventListener('submit', async function(ve) { ve.preventDefault(); try { await api('/api/auth/verify-email', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email, code: document.getElementById('verifyCode').value.trim()}) }); showSuccess('Verified! Redirecting...'); setTimeout(function() { window.location.href = APP_ROUTE; }, 1000); } catch (err) { showError(err.message); } });
    } catch (err) { showError(err.message); } finally { btn.disabled = false; btn.textContent = 'Create account'; }
  });

  function signInWithGoogle() { showError('Google login coming soon. Use email and password.'); }
  document.getElementById('googleLoginBtn').addEventListener('click', signInWithGoogle);
  document.getElementById('googleSignupBtn').addEventListener('click', signInWithGoogle);

  document.getElementById('forgotLink').addEventListener('click', async function(e) {
    e.preventDefault(); hideMessages();
    var email = document.getElementById('loginEmail').value.trim();
    if (!email) { showError('Enter your email above first.'); return; }
    try {
      await api('/api/auth/forgot-password', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email}) });
      showSuccess('If an account exists, a reset code has been sent to your email.');
      heading.textContent = 'Reset your password';
      loginForm.classList.add('hidden'); signupForm.classList.add('hidden');
      heading.insertAdjacentHTML('afterend', '<div id="resetBox"><form id="resetForm"><div class="field"><label>Reset code</label><input type="text" id="resetCode" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:8px"></div><div class="field"><label>New password</label><input type="password" id="resetNewPassword" minlength="6"></div><button type="submit" class="btn btn-primary">Reset password</button></form></div>');
      document.getElementById('resetForm').addEventListener('submit', async function(re) {
        re.preventDefault();
        var code = document.getElementById('resetCode').value.trim();
        var np = document.getElementById('resetNewPassword').value;
        if (np.length < 6) { showError('Password needs at least 6 characters.'); return; }
        try {
          await api('/api/auth/reset-with-code', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email, code: code, new_password: np}) });
          showSuccess('Password reset! Redirecting to login...');
          setTimeout(function() { setMode('login'); history.replaceState(null, '', 'auth.html?mode=login'); }, 1500);
        } catch (err) { showError(err.message); }
      });
    } catch (err) { showError(err.message); }
  });

  checkSession();
})();
</script>
</body>
</html>

name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile-android/**", ".github/workflows/android-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: mobile-android
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          WEBSITE_URL: https://clpzit.vercel.app
        run: gradle :app:assembleDebug
      - name: Name installable APK
        run: cp mobile-android/app/build/outputs/apk/debug/app-debug.apk CLPZ-Mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLPZ-Mobile-debug
          path: CLPZ-Mobile.apk
      - name: Publish mobile preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: CLPZ Mobile preview
          prerelease: true
          body: Install the Android preview, sign in with the same CLPZ account, and edit or export clips on your device.
          files: CLPZ-Mobile.apk

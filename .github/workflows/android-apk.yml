name: Android APK
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile-android/**", ".github/workflows/android-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clpz-preview-signing-v1
      - name: Build debug APK
        working-directory: mobile-android
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          WEBSITE_URL: https://clpzit.vercel.app
        run: gradle :app:assembleDebug
      - name: Name installable APK
        run: cp mobile-android/app/build/outputs/apk/debug/app-debug.apk CLPZ-Mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLPZ-Mobile-debug
          path: CLPZ-Mobile.apk
      - name: Publish mobile preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: CLPZ Mobile preview
          prerelease: true
          body: Install the Android preview, sign in with the same CLPZ account, and edit or export clips on your device.
          files: CLPZ-Mobile.apk
  interface-checks:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate local test footage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p mobile-android/app/src/androidTest/assets
          ffmpeg -f lavfi -i "testsrc2=size=360x640:rate=24" -f lavfi -i "sine=frequency=440" -t 6 -c:v libx264 -pix_fmt yuv420p -c:a aac mobile-android/app/src/androidTest/assets/fixture.mp4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash mobile-android/check-interface.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-UI-checks
          path: |
            ui-screenshots
            mobile-android/app/build/reports/androidTests
            mobile-android/app/build/outputs/androidTest-results
